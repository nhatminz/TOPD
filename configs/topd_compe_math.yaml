_base_: qwen3_b200_cmt.yaml

experiment:
  method: topd
  seed: 42
  output_dir: outputs/topd_compe_math_4b_17b_seed42/topd
  require_b200: true

models:
  # User-confirmed B200 checkpoint paths, relative to STORAGE_ROOT.
  teacher_path: models/Qwen3-4B
  student_path: models/Qwen3-1.7B

training:
  epochs: 1
  max_steps: null
  save_interval: 20
  save_checkpoints: true
  save_optimizer: true

# Train continuously; run scripts/eval_multiseed_b200.sh on final/ afterward.
training_evaluation:
  enabled: false
  eval_at_start: false
  eval_at_end: false

topd:
  enabled: true
  teacher_source: Qwen/Qwen3-4B
  student_source: Qwen/Qwen3-1.7B
  # Revisions are pinned when optional official metadata verification is enabled.
  teacher_revision: main
  student_revision: main
  # B200 already has local checkpoints. Never download or redirect their paths.
  # Optional official SHA256 comparison only queries HF metadata, not weights.
  verify_official_weights: false
  future_window: 50
  # Reproduction assumptions, NOT reported paper hyperparameters.
  candidate_fraction: 0.02
  candidate_budget: null
  candidate_min_loss: null
  divergence_mode: percentile
  ot_quantile: 0.5
  ot_threshold: 0.0
  min_ot_distance: 1.0e-8
  ground_cost: teacher_embedding_cosine
  ot_solver: exact
  ot_tolerance: 1.0e-7
  ot_max_iterations: 10000
  sinkhorn_epsilon: 0.05
  future_temperature: 1.0
  future_top_p: 1.0
  future_seed: 1000042
  future_backend: shared_prefix
  # Reference backend remains available only for equivalence/performance probes.
  reference_generation_batch_size: 4
  generation_batch_size: auto
  generation_max_batch_size: 64
  generation_token_budget: 131072
  loss_micro_batch_size: auto
  loss_max_batch_size: 32
  loss_token_budget: 65536
  memory_headroom_gib: 8
  workspace_fraction: 0.65
  prefix_pool_fraction: 0.25
  accumulation_no_sync: auto
  batched_kl: true
  kl_chunk_tokens: 32
  ot_workers: 4
  # Optional bounded operator/communication trace, e.g. TOPD_PROFILE_STEPS=1,2.
  profile_steps: []
  trajectory_temperature: 1.0
  # Mean of each accepted window's SUM of token KLs. K is not divided out.
  trajectory_normalization: window_mean_sum
  lambda_topd: 0.01
  log_candidate_details: false
